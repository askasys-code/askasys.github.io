<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script PowerShell - askasys</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
        }
        h1 {
            text-align: center;
            margin-bottom: 10px;
        }
        p.info {
            text-align: center;
            font-style: italic;
            margin-bottom: 40px;
        }
        #scripts {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin: 0 0 15px 0;
            word-break: break-all;
        }
        .card button {
            padding: 8px 16px;
            margin-right: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .card button.download {
            background: #007bff;
            color: white;
        }
        .card button.view {
            background: #28a745;
            color: white;
        }
        .card button:hover {
            opacity: 0.9;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.6);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 1000px;
            max-height: 85vh;
            overflow: auto;
            position: relative;
        }
        .close {
            position: absolute;
            top: 10px;
            right: 20px;
            color: #aaa;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: #000;
        }
        #modal-title {
            margin-top: 0;
            margin-bottom: 20px;
        }
        pre {
            margin: 0;
        }
    </style>
</head>
<body>
    <h1>Script PowerShell</h1>
    <p class="info">Elenco degli script presenti nella cartella <code>powershell_script</code>. Carica nuovi file .ps1 in quella cartella per vederli apparire automaticamente.</p>

    <div id="scripts"></div>

    <!-- Modal per anteprima -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">Anteprima</h2>
            <pre><code id="code" class="language-powershell"></code></pre>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-powershell.min.js"></script>
    <script>
        const owner = 'askasys-code';
        const repo = 'askasys.github.io';
        const folder = 'powershell_script';
        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${folder}`;

        const listDiv = document.getElementById('scripts');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const codeElement = document.getElementById('code');
        const closeBtn = document.querySelector('.close');

        closeBtn.onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };

        fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error('Cartella non trovata o errore API');
                return response.json();
            })
            .then(files => {
                if (!Array.isArray(files)) {
                    listDiv.innerHTML = '<p>Errore nel caricamento dei contenuti.</p>';
                    return;
                }

                const ps1Files = files.filter(file => file.type === 'file' && file.name.toLowerCase().endsWith('.ps1'));

                if (ps1Files.length === 0) {
                    listDiv.innerHTML = '<p>Nessuno script PowerShell presente nella cartella.</p>';
                    return;
                }

                ps1Files.forEach(file => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${file.name}</h3>
                        <button class="download" onclick="downloadFile('${file.download_url}', '${file.name}')">Scarica</button>
                        <button class="view" onclick="viewFile('${file.download_url}', '${file.name}')">Anteprima</button>
                    `;
                    listDiv.appendChild(card);
                });
            })
            .catch(err => {
                listDiv.innerHTML = `<p>${err.message || 'Impossibile caricare gli script.'}</p>`;
            });

        function downloadFile(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function viewFile(url, filename) {
            fetch(url)
                .then(res => res.text())
                .then(text => {
                    codeElement.textContent = text;
                    Prism.highlightElement(codeElement);
                    modalTitle.textContent = `Anteprima: ${filename}`;
                    modal.style.display = 'block';
                });
        }
    </script>
</body>
</html>
